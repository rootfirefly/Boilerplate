<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina UI - Vercel Demo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS (Glassmorphism e Animações) -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Elementos de fundo para efeito Glassmorphism -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <main class="relative z-10 w-full max-w-md p-8 glass-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/60">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-8" id="header">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-indigo-200">
                <i data-lucide="zap" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Acesso Antecipado</h1>
            <p class="text-sm text-slate-500 mt-2">Registe-se para aceder à demonstração.</p>
        </div>

        <!-- Formulário -->
        <form id="leadForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1 ml-1">Nome Completo</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="nome" required class="w-full pl-10 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder-slate-400 text-sm" placeholder="O seu nome">
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1 ml-1">WhatsApp</label>
                <div class="relative">
                    <i data-lucide="phone" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="tel" id="whatsapp" required class="w-full pl-10 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder-slate-400 text-sm" placeholder="(00) 00000-0000">
                </div>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium transition-colors flex items-center justify-center gap-2 shadow-md">
                <span>Garantir Acesso</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        
        <!-- Mensagem de Sucesso (Oculta por defeito) -->
        <div id="mensagem" class="mt-4 text-center text-sm hidden"></div>
    </main>

    <!-- Lógica JavaScript (Demonstração com LocalStorage) -->
    <script>
        // Inicializar os ícones na primeira carga
        lucide.createIcons();

        document.getElementById('leadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = document.getElementById('leadForm');
            const header = document.getElementById('header');
            const botao = e.target.querySelector('button');
            const divMensagem = document.getElementById('mensagem');
            const inputNome = document.getElementById('nome').value;
            const inputWhatsapp = document.getElementById('whatsapp').value;
            
            // Estado de carregamento
            botao.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processando...';
            lucide.createIcons();
            botao.disabled = true;

            // Simular o atraso de um servidor (1.5 segundos)
            setTimeout(() => {
                // Gravar no LocalStorage (simula a base de dados na Vercel)
                let leads = JSON.parse(localStorage.getItem('leads_demo')) || [];
                leads.push({ 
                    nome: inputNome, 
                    whatsapp: inputWhatsapp, 
                    data: new Date().toLocaleString('pt-PT') 
                });
                localStorage.setItem('leads_demo', JSON.stringify(leads));

                console.log("📦 Leads gravados no LocalStorage:", leads);

                // Animação de Sucesso: Esconder o formulário e o cabeçalho
                form.style.display = 'none';
                header.style.display = 'none';
                
                // Mostrar a mensagem de sucesso interativa
                divMensagem.classList.remove('hidden');
                divMensagem.innerHTML = `
                    <div class="flex flex-col items-center justify-center space-y-3 transition-opacity duration-500 opacity-100 py-6">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-2 shadow-inner">
                            <i data-lucide="check-circle" class="text-green-500 w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-slate-800">Tudo certo, ${inputNome.split(' ')[0]}!</h3>
                        <p class="text-sm text-slate-500">O seu contacto foi guardado no LocalStorage do navegador.</p>
                        <button onclick="location.reload()" class="mt-6 px-5 py-2.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl text-sm font-medium transition-colors shadow-sm">
                            Testar novamente
                        </button>
                    </div>
                `;
                
                // Renderizar os novos ícones injetados
                lucide.createIcons();

            }, 1500);
        });
    </script>
</body>
</html>
